# Every value can reference an environment variable: ${NAME} or ${NAME:-default}.
# Keep secrets in the environment, not in this file.

server:
  host: 0.0.0.0
  port: ${PORT:-8080}
  # Base URL clients reach the proxy at. Proxied media links are built from it.
  publicUrl: ${PUBLIC_URL}
  # Reverse proxies whose X-Forwarded-For is trusted, as addresses, CIDRs or
  # proxy-addr names (loopback, linklocal, uniquelocal). Without it, rate limits
  # see the proxy's address instead of the client's.
  trustProxy: []
  # On SIGTERM, fail /readyz this long before closing, so the pod leaves the
  # load balancer first.
  shutdownDelaySeconds: 5

logLevel: ${LOG_LEVEL:-info}

auth:
  # Matrix users authenticate with an OpenID token from
  # POST /_matrix/client/v3/user/{userId}/openid/request_token.
  # With several homeservers, clients name theirs in the X-Matrix-Server-Name header.
  matrix:
    homeservers:
      - serverName: example.com
        # Where the federation API answers. Defaults to https://<serverName>.
        federationUrl: https://matrix.example.com
    tokenCacheSeconds: 300
  # Users of an OIDC provider (SSO) authenticate with its access token.
  oidc:
    providers:
      # Must equal the tokens' iss claim. Endpoints come from its discovery document.
      - issuer: https://sso.example.com/
        # When set, tokens must be issued to one of these client ids.
        audiences: [twake-mail]
        # Opaque tokens are checked through introspection with these credentials,
        # or through userinfo when they are absent (which cannot check audiences).
        introspection:
          clientId: twake-common-proxy
          clientSecret: ${OIDC_CLIENT_SECRET}
    tokenCacheSeconds: 300
  # Backends (cozy-stack /remote, ...) authenticate with a static bearer token, 32+ characters.
  services:
    - name: cozy-stack
      token: ${COZY_STACK_TOKEN}

# Web apps allowed to call the proxy from the browser.
cors:
  origins:
    - https://chat.example.com

rateLimit:
  # Requests per caller (Matrix user or backend) per window.
  max: 120
  # Requests per client address per window, counted before authentication and
  # on media downloads. Keep it high: users behind one NAT share it.
  maxPerIp: 1200
  windowSeconds: 60

upstream:
  # For API calls and for the start of a media download.
  timeoutMs: 5000

media:
  # HMAC key for proxied media links, 32+ characters. Rotating it invalidates links in flight.
  signingKey: ${MEDIA_SIGNING_KEY}
  urlTtlSeconds: 3600
  maxBytes: 20971520

modules:
  gif:
    enabled: true
    provider: klipy
    # Stream GIF files through the proxy so the provider never sees user IPs.
    proxyMedia: true
    providers:
      klipy:
        apiKey: ${KLIPY_API_KEY}
        contentFilter: medium
